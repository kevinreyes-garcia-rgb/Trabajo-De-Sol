<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Cultural Hispano</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-rose-950/20 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="border-b border-rose-900/30 bg-rose-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div>
                <span id="headerTagline" class="text-xs font-semibold text-rose-400 uppercase tracking-widest"></span>
                <h1 id="mainTitle" class="text-2xl font-bold text-rose-100"></h1>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- Selector de Idioma -->
                <select id="langSelect" class="bg-rose-900/40 border border-rose-700/50 text-rose-100 text-sm rounded-lg p-2.5 focus:ring-rose-500 focus:border-rose-500 outline-none">
                    <option value="es" class="bg-slate-900 text-white">Español 🇪🇸</option>
                    <option value="en" class="bg-slate-900 text-white">English 🇺🇸</option>
                    <option value="fr" class="bg-slate-900 text-white">Français 🇫🇷</option>
                </select>

                <!-- Botón Cambiar Vista -->
                <button id="btnToggleView" class="bg-rose-800/40 hover:bg-rose-700/50 text-rose-100 border border-rose-600/40 px-4 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                    <i id="toggleIcon" class="fa-solid fa-table"></i>
                    <span id="btnToggleText"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <p id="mainSubtitle" class="text-rose-200/70 text-center max-w-2xl mx-auto mb-8 text-sm sm:text-base"></p>

        <!-- Buscador -->
        <div class="max-w-md mx-auto mb-10 relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-rose-400/60"></i>
            <input type="text" id="searchInput" class="w-full bg-rose-950/30 border border-rose-800/40 rounded-xl pl-10 pr-4 py-3 text-rose-100 placeholder-rose-300/40 focus:outline-none focus:ring-2 focus:ring-rose-500/50">
        </div>

        <!-- Vista de Tarjetas -->
        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Vista de Tabla (Vacía para llenar) -->
        <div id="tableView" class="hidden overflow-x-auto bg-rose-950/20 rounded-2xl border border-rose-900/30 shadow-xl">
            <table class="w-full text-left text-sm text-rose-100/90">
                <thead class="bg-rose-900/40 text-xs uppercase text-rose-300 tracking-wider border-b border-rose-800/40">
                    <tr>
                        <th id="thCountry" class="p-4"></th>
                        <th id="thDish" class="p-4"></th>
                        <th id="thDance" class="p-4"></th>
                        <th id="thMusic" class="p-4"></th>
                        <th id="thSport" class="p-4"></th>
                        <th id="thPerson" class="p-4"></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- Mensaje Sin Resultados -->
        <div id="noResults" class="hidden text-center py-12">
            <h3 id="noResultsTitle" class="text-xl font-bold text-rose-200 mb-2"></h3>
            <p id="noResultsText" class="text-rose-400/70"></p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-rose-900/30 bg-rose-950/90 py-6 text-center text-xs text-rose-300/60">
        <p><span id="lblFooterCreated"></span> <strong class="text-rose-300 font-semibold">Chizu</strong></p>
        <p id="lblFooterHosted" class="mt-1 text-rose-400/40"></p>
    </footer>

    <!-- Custom Script -->
    <script src="js/script.js"></script>
</body>
</html>
