<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultural - Hispanoamérica</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div>
                <span id="headerTagline" class="text-xs font-semibold text-pink-400 uppercase tracking-wider"></span>
                <h1 id="mainTitle" class="text-2xl font-bold text-white"></h1>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- Selector de Idioma -->
                <select id="langSelect" class="bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-pink-500 focus:border-pink-500">
                    <option value="es">Español 🇪🇸</option>
                    <option value="en">English 🇺🇸</option>
                    <option value="fr">Français 🇫🇷</option>
                </select>

                <!-- Botón Cambiar Vista -->
                <button id="btnToggleView" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                    <i id="toggleIcon" class="fa-solid fa-table"></i>
                    <span id="btnToggleText"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <p id="mainSubtitle" class="text-slate-400 text-center max-w-2xl mx-auto mb-8"></p>

        <!-- Buscador -->
        <div class="max-w-md mx-auto mb-8 relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-500"></i>
            <input type="text" id="searchInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <!-- Vista de Tarjetas -->
        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Vista de Tabla -->
        <div id="tableView" class="hidden overflow-x-auto bg-slate-800/50 rounded-2xl border border-slate-800">
            <table class="w-full text-left text-sm text-slate-300">
                <thead class="bg-slate-800 text-xs uppercase text-slate-400 border-b border-slate-700">
                    <tr>
                        <th id="thCountry" class="p-4"></th>
                        <th id="thDish" class="p-4"></th>
                        <th id="thDance" class="p-4"></th>
                        <th id="thMusic" class="p-4"></th>
                        <th id="thSport" class="p-4"></th>
                        <th id="thPerson" class="p-4"></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- Sin Resultados -->
        <div id="noResults" class="hidden text-center py-12">
            <h3 id="noResultsTitle" class="text-xl font-bold text-slate-300 mb-2"></h3>
            <p id="noResultsText" class="text-slate-500"></p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-950 py-6 text-center text-xs text-slate-500">
        <p><span id="lblFooterCreated"></span> <span id="lblCreatedBy"></span></p>
        <p id="lblFooterHosted" class="mt-1 text-slate-600"></p>
    </footer>

    <!-- Custom Script -->
    <script src="js/script.js"></script>
</body>
</html>
